<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="dark">
<title>Factory Floor · locked</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="stylesheet" href="/app.css"></head>
<body>
<div class="screen">
  <div class="titlebar">{{mark}}<h1>Factory Floor</h1><span class="drag"></span><span class="tick"><svg class="gear" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8zm9.4 5.3-2.1-.4a7.5 7.5 0 0 0-.6-1.5l1.2-1.8-1.9-1.9-1.8 1.2c-.5-.3-1-.5-1.5-.6l-.4-2.1h-2.6l-.4 2.1c-.5.1-1 .3-1.5.6L8 6.7 6.1 8.6l1.2 1.8c-.3.5-.5 1-.6 1.5l-2.1.4v2.6l2.1.4c.1.5.3 1 .6 1.5l-1.2 1.8 1.9 1.9 1.8-1.2c.5.3 1 .5 1.5.6l.4 2.1h2.6l.4-2.1c.5-.1 1-.3 1.5-.6l1.8 1.2 1.9-1.9-1.2-1.8c.3-.5.5-1 .6-1.5l2.1-.4z"/></svg>{{hostname}}</span></div>
  <div class="belt" aria-hidden="true"><div class="items"></div><div class="inserter"><svg viewBox="0 0 32 30"><rect x="10" y="22" width="12" height="6" fill="#4A4A4A" stroke="#0A0A0A"/><g class="arm"><rect x="14" y="4" width="4" height="22" fill="#E39827" stroke="#0A0A0A"/><rect x="10" y="1" width="12" height="5" fill="#5C5C5C" stroke="#0A0A0A"/></g></svg></div></div>
  <form class="lock" id="lock" autocomplete="off">
    <svg class="pad" viewBox="0 0 60 60" aria-hidden="true"><path d="M18 28v-9a12 12 0 0 1 24 0v9" fill="none" stroke="#8C8C8C" stroke-width="6" stroke-linecap="round"/><rect x="10" y="27" width="40" height="28" fill="#E39827" stroke="#0A0A0A" stroke-width="2"/><rect x="12" y="29" width="36" height="3" fill="#FFD48A"/><circle cx="30" cy="40" r="4" fill="#2A1A05"/><rect x="28" y="42" width="4" height="7" fill="#2A1A05"/></svg>
    <h2 id="title">Locked</h2>
    <p id="hint">Enter the passcode to see the factories on {{hostname}}.</p>
    <input id="code" class="codebox" type="password" inputmode="numeric" autocomplete="one-time-code" aria-label="passcode" autofocus>
    <div class="keys" id="keys">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="del" aria-label="delete">⌫</button><button type="button" data-k="0">0</button><button type="submit" class="confirm" aria-label="unlock">✓</button>
    </div>
    <span class="note" id="note"></span>
  </form>
</div>
<script>
(function(){
  var lockedMs = Number('{{lockedMs}}') || 0;
  var code = document.getElementById('code'), note = document.getElementById('note'), title = document.getElementById('title'), form = document.getElementById('lock');
  function say(t, bad){ note.textContent = t; note.classList.toggle('bad', !!bad); }
  function lockout(ms){ title.textContent = 'Gate locked'; say('Too many wrong passcodes. Try again in ' + Math.ceil(ms/60000) + ' min.', true); form.querySelectorAll('button,input').forEach(function(b){ b.disabled = true; }); setTimeout(function(){ location.reload(); }, ms + 500); }
  if (lockedMs > 0) lockout(lockedMs);
  document.getElementById('keys').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if (!b) return;
    if (b.dataset.k === 'del') code.value = code.value.slice(0, -1); else code.value += b.dataset.k;
    code.focus();
  });
  form.addEventListener('submit', function(e){
    e.preventDefault(); if (!code.value) return;
    fetch('/unlock', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ code: code.value }) })
      .then(function(r){ return r.json().then(function(j){ return [r.status, j]; }); })
      .then(function(x){ var st = x[0], j = x[1];
        if (st === 200) { location.replace('/'); return; }
        code.value = '';
        if (st === 429) lockout(j.lockedMs || 300000); else say('Wrong passcode. ' + (j.attemptsLeft || 0) + ' attempts left before the gate locks.', true);
      }).catch(function(){ say('The console did not answer.', true); });
  });
})();
</script>
</body></html>
