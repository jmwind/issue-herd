# Lint, type-check, build, test uncached, and install the produced artifact into a clean prefix —
# on the declared Node floor and on a newer runtime. A release is acceptable only when this is green.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm exec turbo run lint typecheck build
      - run: pnpm exec turbo run test --force
      - run: node scripts/verify-install.mjs
      # The path users take: npm clones and runs prepare with no pnpm or turbo of its own.
      - run: node scripts/verify-install.mjs --git
